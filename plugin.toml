schema = 1
id = "tern-grafana"
name = "Tern Grafana"
version = "0.0.1"
description = "Native Grafana and Prometheus views: queries, dashboards, alerts and silences inside Tern."
icon = "chart"
host = "plugin/host.luau"
window = "plugin/window.luau"
styles = [
	"plugin/tern-grafana.css",
	"plugin/settings.css",
	"plugin/dashboard.css",
	"plugin/panels.css",
	"plugin/alerts.css",
]

[[blocks]]
id = "query"
title = "Tern Grafana Query"
icon = "chart"

[[blocks]]
id = "settings"
title = "Tern Grafana Settings"
icon = "sliders"

[[blocks]]
id = "dashboard"
title = "Tern Grafana Dashboard"
icon = "chart"

[[blocks]]
id = "panel"
title = "Tern Grafana Panel"
icon = "chart"

[[blocks]]
id = "alerts"
title = "Grafana Alerts"
icon = "flame"

[[lenses]]
id = "promtool-query"
match = [
	"promtool query instant *",
	"promtool query range *",
	"promtool query series *",
	"promtool query labels *",
	"promtool query -* instant *",
	"promtool query -* range *",
	"promtool query -* series *",
	"promtool query -* labels *",
	"promtool -* query *",
]
