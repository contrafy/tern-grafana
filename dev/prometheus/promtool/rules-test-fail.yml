# `promtool test rules` input that fails: the expectations are wrong on purpose.
rule_files:
  - ../rules/alerts.yml
evaluation_interval: 10s
tests:
  - interval: 10s
    input_series:
      - series: 'up{job="node", instance="node-exporter:9100"}'
        values: '1x30'
    alert_rule_test:
      - alertname: TernTargetDown
        eval_time: 1m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: node-exporter:9100
