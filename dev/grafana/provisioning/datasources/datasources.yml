# Fixed uids so dashboards, alert rules and fixtures can reference datasources stably.
# Provisioned identically into Grafana 12 and Grafana 11.
apiVersion: 1

datasources:
  - name: Prometheus 3
    uid: prom3
    type: prometheus
    access: proxy
    url: http://prometheus3:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Prometheus 2.53
    uid: prom2
    type: prometheus
    access: proxy
    url: http://prometheus2:9090
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prom3
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prom3
