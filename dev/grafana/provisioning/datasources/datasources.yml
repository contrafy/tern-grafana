# Fixed uids so dashboards, alert rules and fixtures can reference datasources stably.
# Provisioned identically into Grafana 12 and Grafana 11.
apiVersion: 1

datasources:
  - name: Prometheus 3
    uid: prom3
    type: prometheus
    access: proxy
    url: http://prometheus3:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Prometheus 2.53
    uid: prom2
    type: prometheus
    access: proxy
    url: http://prometheus2:9090
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prom3
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prom3

  # Deterministic frames (csv_content, random_walk with seed, node_graph, flame_graph, trace) for the
  # tern-all-panels dashboard. Core plugin in Grafana 11 and 12.
  - name: TestData
    uid: testdata
    type: grafana-testdata-datasource
    access: proxy

  # dev/postgres (dashboard tern-sql). Local-only credentials from dev/compose.yml.
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: tern
    jsonData:
      database: tern
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: tern-dev

  # JSON API (dashboard tern-s4-json), OpenWeatherMap-like documents from dev/json. The appid is fake: it
  # sits in non-secure jsonData.queryParams exactly like the real API key would, to exercise redaction.
  - name: Weather Dallas
    uid: json-dallas
    type: marcusolsson-json-datasource
    access: proxy
    url: http://jsonapi:8080/data/2.5/weather-dallas.json
    jsonData:
      queryParams: lat=32.78&lon=-96.8&units=imperial&appid=tern-fake-appid-0123456789abcdef

  - name: Weather Chicago
    uid: json-chicago
    type: marcusolsson-json-datasource
    access: proxy
    url: http://jsonapi:8080/data/2.5/weather-chicago.json
    jsonData:
      queryParams: lat=41.88&lon=-87.63&units=imperial&appid=tern-fake-appid-0123456789abcdef

  - name: Weather Seattle
    uid: json-seattle
    type: marcusolsson-json-datasource
    access: proxy
    url: http://jsonapi:8080/data/2.5/weather-seattle.json
    jsonData:
      queryParams: lat=47.61&lon=-122.33&units=imperial&appid=tern-fake-appid-0123456789abcdef

  # The API as a base URL: targets pick the document with urlPath (forecast, cities for the `city` query
  # variable, weather-${city}.json) and add params, as most JSON API panels do.
  - name: Weather API
    uid: json-api
    type: marcusolsson-json-datasource
    access: proxy
    url: http://jsonapi:8080/data/2.5
    jsonData:
      queryParams: units=imperial&appid=tern-fake-appid-0123456789abcdef

  # Zabbix 7.0 (profile zabbix, dashboard tern-s4-zabbix). Errors until `sh scripts/stack.sh zabbix` ran.
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      authType: userLogin
      username: Admin
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1h
      timeout: 30
    secureJsonData:
      password: zabbix
