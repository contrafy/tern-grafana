# Local dev stack for tern-grafana. Drive it with `sh scripts/stack.sh up|down|status|reset|capture`.
# Every published port binds to 127.0.0.1. Containers keep their state in their own writable layer
# (nothing is bind-mounted read-write), so `down` discards it; config is mounted read-only from dev/.
# Admin credentials below are for this local stack only.
name: tern-grafana-dev

x-grafana-env: &grafana-env
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: tern-dev
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_NEWS_NEWS_FEED_ENABLED: "false"
  GF_PLUGINS_PREINSTALL_DISABLED: "true"
  # Community plugins, pinned, installed by the image's run.sh at container start (needs network on
  # first start). Grafana 12's run.sh only honors GF_INSTALL_PLUGINS with _FORCE; 11 ignores _FORCE.
  # grafana11 overrides this list: dynamictext 6.3.1 requires Grafana >= 12.3.0.
  GF_INSTALL_PLUGINS: >-
    grafana-clock-panel 2.1.8,marcusolsson-json-datasource 1.3.23,marcusolsson-dynamictext-panel 6.3.1,marcusolsson-treemap-panel 2.1.1,alexanderzobnin-zabbix-app 6.10.2
  GF_INSTALL_PLUGINS_FORCE: "true"
  GF_LOG_LEVEL: warn
  GF_UNIFIED_ALERTING_ENABLED: "true"
  GF_UNIFIED_ALERTING_MIN_INTERVAL: 10s

services:
  grafana12:
    image: grafana/grafana:12.4.12
    depends_on: [renderer]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *grafana-env
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000/
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana12:3000/
      # The 12.4 gauge (shape, segments, sparkline, effects) is behind this public-preview toggle.
      GF_FEATURE_TOGGLES_ENABLE: newGauge
    volumes: &grafana-volumes
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      # Static RSS feed for the news panel, served same-origin at /public/tern-news/feed.xml.
      - ./grafana/news:/usr/share/grafana/public/tern-news:ro
    healthcheck: &grafana-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Deliberately without an image renderer, so the "no renderer" ladder step is capturable.
  grafana11:
    image: grafana/grafana:11.6.16
    ports: ["127.0.0.1:3011:3000"]
    environment:
      <<: *grafana-env
      GF_SERVER_ROOT_URL: http://127.0.0.1:3011/
      # Same list without marcusolsson-dynamictext-panel (6.3.1 needs Grafana >= 12.3.0).
      GF_INSTALL_PLUGINS: >-
        grafana-clock-panel 2.1.8,marcusolsson-json-datasource 1.3.23,marcusolsson-treemap-panel 2.1.1,alexanderzobnin-zabbix-app 6.10.2
    volumes: *grafana-volumes
    healthcheck: *grafana-health

  # Shares the image renderer with grafana12, so the render ladder step is capturable on 13 too.
  grafana13:
    image: grafana/grafana:13.3.0
    depends_on: [renderer]
    ports: ["127.0.0.1:3013:3000"]
    environment:
      <<: *grafana-env
      GF_SERVER_ROOT_URL: http://127.0.0.1:3013/
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana13:3000/
      # Grafana 13 refuses to start with the default renderer token "-" (12.4 still uses it).
      GF_RENDERING_RENDERER_TOKEN: tern-dev-renderer
    volumes: *grafana-volumes
    healthcheck: *grafana-health

  renderer:
    image: grafana/grafana-image-renderer:v5.12.7
    environment:
      GOMEMLIMIT: 1GiB
      # The default token for grafana12, a local-only one for grafana13.
      AUTH_TOKEN: "-,tern-dev-renderer"

  prometheus3:
    image: quay.io/prometheus/prometheus:v3.15.0
    ports: ["127.0.0.1:9090:9090"]
    command: &prom-args
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
    healthcheck: &prom-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus2:
    image: quay.io/prometheus/prometheus:v2.53.5
    ports: ["127.0.0.1:9091:9090"]
    command: *prom-args
    volumes:
      - ./prometheus:/etc/prometheus:ro
    healthcheck: *prom-health

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.1
    ports: ["127.0.0.1:9093:9093"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # SQL datasource panels (dashboard tern-sql): seeded by dev/postgres/init.sql, reached by the
  # Grafanas on the stack network only.
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: tern-dev
      POSTGRES_DB: tern
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tern", "-d", "tern"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Loki and Tempo images ship no shell; scripts/stack.sh probes their /ready endpoints from the host.
  loki:
    image: grafana/loki:3.7.8
    ports: ["127.0.0.1:3100:3100"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro

  tempo:
    image: grafana/tempo:3.1.1
    ports: ["127.0.0.1:3200:3200"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo:/etc/tempo:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Pushes labeled, multi-level log lines to Loki, plus one line per recent Tempo trace (job tracegen).
  loggen:
    image: quay.io/curl/curl:8.23.0
    depends_on: [loki, tempo]
    entrypoint: ["/bin/sh", "/gen/loggen.sh"]
    environment:
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
    volumes:
      - ./generators:/gen:ro

  # OTLP traces into Tempo. Tempo's metrics generator turns them into span metrics with
  # exemplars (label traceID) remote-written to both Prometheus servers.
  tracegen-frontend:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
    depends_on: [tempo]
    command:
      - traces
      - --otlp-endpoint=tempo:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=2
      - --child-spans=3
      - --span-duration=40ms
      - --service=frontend
      - --telemetry-attributes=http.route="/checkout"

  tracegen-payments:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
    depends_on: [tempo]
    command:
      - traces
      - --otlp-endpoint=tempo:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=0.5
      - --child-spans=2
      - --span-duration=120ms
      - --service=payments
      - --status-code=Error

  # OpenWeatherMap-like documents (dev/json) for the JSON API datasources. busybox httpd ignores the
  # query string, so the fake appid in jsonData.queryParams only exercises redaction.
  jsonapi:
    image: busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
    command: ["httpd", "-f", "-p", "8080", "-h", "/www", "-c", "/www/httpd.conf"]
    volumes:
      - ./json:/www:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/data/2.5/weather-dallas.json"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Opt-in Zabbix 7.0 (`sh scripts/stack.sh zabbix`): server and web share database `zabbix` in the
  # postgres service (the server image creates it on first start), agent2 is polled by every host
  # dev/zabbix/bootstrap.sh creates. Web UI and API on 127.0.0.1:18080 (Admin / zabbix).
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.32@sha256:401dc90cff398aaf6a0fa72625f4b9b57407e61231f94e13e7f4e68aeff0c42c
    profiles: [zabbix]
    depends_on:
      postgres: {condition: service_healthy}
    environment: &zabbix-db
      DB_SERVER_HOST: postgres
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: tern-dev
      POSTGRES_DB: zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.32@sha256:a54ce2e19aaf0a61609e4bbc7ec01c16bef504e6e1c51e3854120ac76d2dbaeb
    profiles: [zabbix]
    depends_on: [zabbix-server]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      <<: *zabbix-db
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: UTC

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.32@sha256:aa8fa07dbd41e148b6156555bf10ba6d928efa40f9a4632d6787fb90d4756679
    profiles: [zabbix]
    depends_on: [zabbix-server]
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PASSIVESERVERS: 0.0.0.0/0

  # CLI-only image for fixture capture (`docker compose run --rm logcli ...`); never started by `up`.
  logcli:
    image: grafana/logcli:3.7.8
    profiles: [tools]
    environment:
      LOKI_ADDR: http://loki:3100
